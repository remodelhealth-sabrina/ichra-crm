<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICHRA Broker CRM — CA & HI Markets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#ffffff;--bg-secondary:#f5f5f3;--bg-tertiary:#eeecea;
  --text-primary:#1a1a1a;--text-secondary:#555;--text-tertiary:#888;
  --border-light:rgba(0,0,0,0.1);--border-mid:rgba(0,0,0,0.18);
  --blue-bg:#e6f1fb;--blue-text:#185fa5;--blue-border:#85b7eb;
  --green-bg:#eaf3de;--green-text:#3b6d11;
  --amber-bg:#faeeda;--amber-text:#854f0b;
  --red-bg:#faece7;--red-text:#993c1d;
  --purple-bg:#eeedfe;--purple-text:#3c3489;
  --radius:8px;--radius-lg:12px;
  --shadow:0 1px 4px rgba(0,0,0,0.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-tertiary);color:var(--text-primary);font-size:14px;min-height:100vh}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:230px;min-width:230px;background:var(--bg-primary);border-right:1px solid var(--border-light);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border-light)}
.sidebar-logo h1{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-.3px}
.sidebar-logo p{font-size:11px;color:var(--text-tertiary);margin-top:3px}
.nav-section{padding:14px 12px 4px;font-size:10px;font-weight:600;color:var(--text-tertiary);letter-spacing:.08em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;border:none;background:none;cursor:pointer;border-radius:var(--radius);color:var(--text-secondary);font-size:13px;text-align:left;transition:background .12s;margin-bottom:1px}
.nav-btn:hover{background:var(--bg-secondary)}
.nav-btn.active{background:var(--blue-bg);color:var(--blue-text);font-weight:600}
.nav-btn .nav-icon{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--bg-secondary);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:500}
.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--border-light);font-size:11px;color:var(--text-tertiary)}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:var(--bg-primary);border-bottom:1px solid var(--border-light);padding:12px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.topbar h2{font-size:16px;font-weight:600;flex:1;min-width:80px}
.content{padding:20px;flex:1}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border-mid);background:var(--bg-primary);cursor:pointer;font-size:13px;color:var(--text-primary);display:inline-flex;align-items:center;gap:6px;transition:background .12s;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--bg-secondary)}
.btn-primary{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-border);font-weight:500}
.btn-primary:hover{background:#d5e8f8}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:#fcebeb;color:#a32d2d;border-color:#f09595}
.btn-warning{background:var(--amber-bg);color:var(--amber-text);border-color:#ef9f27}
.btn-success{background:var(--green-bg);color:var(--green-text);border-color:#97c459}

/* INPUTS */
input[type=text],input[type=email],input[type=date],select,textarea{
  padding:8px 10px;border:1px solid var(--border-mid);border-radius:var(--radius);
  background:var(--bg-primary);color:var(--text-primary);font-size:13px;font-family:inherit;
  transition:border .12s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue-border)}
textarea{resize:vertical;min-height:80px}
.search-bar{width:210px}
.filter-sel{width:auto}

/* CARDS & TABLES */
.stat-card{background:var(--bg-secondary);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border-light)}
.stat-card .label{font-size:11px;color:var(--text-secondary);margin-bottom:5px;font-weight:500}
.stat-card .value{font-size:24px;font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.broker-table{width:100%;border-collapse:collapse;background:var(--bg-primary);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-light);box-shadow:var(--shadow)}
.broker-table th{padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border-light);background:var(--bg-secondary);white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
.broker-table td{padding:9px 12px;border-bottom:1px solid var(--border-light);font-size:13px;vertical-align:middle}
.broker-table tr:last-child td{border-bottom:none}
.broker-table tr.clickable:hover td{background:var(--bg-secondary);cursor:pointer}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid transparent}
.badge-hot{background:var(--red-bg);color:var(--red-text)}
.badge-warm{background:var(--amber-bg);color:var(--amber-text)}
.badge-good{background:var(--green-bg);color:var(--green-text)}
.badge-cold{background:var(--blue-bg);color:var(--blue-text)}

/* AVATAR */
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.avatar-lg{width:48px;height:48px;font-size:17px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:30px 20px;overflow-y:auto}
.modal{background:var(--bg-primary);border-radius:var(--radius-lg);width:100%;max-width:740px;border:1px solid var(--border-light);box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:15px;font-weight:600}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border-light);display:flex;gap:8px;justify-content:flex-end;background:var(--bg-secondary);border-radius:0 0 var(--radius-lg) var(--radius-lg)}

/* FORM GRID */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;color:var(--text-secondary);font-weight:600;letter-spacing:.02em}
.form-group input,.form-group select,.form-group textarea{width:100%}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border-light);margin-bottom:18px}
.tab-btn{padding:9px 18px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;font-weight:500;transition:color .12s}
.tab-btn:hover{color:var(--text-primary)}
.tab-btn.active{color:var(--blue-text);border-bottom-color:var(--blue-text);font-weight:600}

/* ACTIVITY TIMELINE */
.timeline{border-left:2px solid var(--border-light);padding-left:18px;margin-left:10px}
.t-item{margin-bottom:16px;position:relative}
.t-dot{width:10px;height:10px;border-radius:50%;background:var(--blue-text);position:absolute;left:-24px;top:4px}
.t-meta{font-size:11px;color:var(--text-tertiary);margin-bottom:3px;font-weight:500}
.t-body{font-size:13px;line-height:1.6;color:var(--text-primary)}

/* MISC */
.divider{height:1px;background:var(--border-light);margin:18px 0}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-header h3{font-size:14px;font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--text-tertiary)}
.empty .icon{font-size:40px;margin-bottom:10px}
.priority-banner{background:#fffbf0;border:1px solid #f0c678;border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:18px}
.priority-banner h4{font-size:13px;font-weight:600;color:#854f0b;margin-bottom:8px}
.priority-chips{display:flex;gap:8px;flex-wrap:wrap}
.priority-chip{background:var(--bg-primary);border:1px solid #f0c678;border-radius:20px;padding:4px 14px;font-size:12px;cursor:pointer;color:var(--text-primary);font-weight:500;transition:background .12s}
.priority-chip:hover{background:var(--bg-secondary)}
.contact-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.info-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg-secondary);border-radius:var(--radius);border:1px solid var(--border-light)}
.info-item .icon{font-size:18px;flex-shrink:0}
.info-item .detail{font-size:11px;color:var(--text-tertiary);margin-bottom:2px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.info-item .val{font-size:13px;color:var(--text-primary);word-break:break-all}
.info-item a{color:var(--blue-text);text-decoration:none}
.support-chip{background:var(--purple-bg);color:var(--purple-text);border-radius:var(--radius);padding:5px 12px;font-size:12px;font-weight:500;display:inline-block;margin:3px}
.email-card{border:1px solid var(--border-light);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:var(--bg-primary)}
.email-card .subject{font-size:13px;font-weight:600;margin-bottom:3px}
.email-card .meta{font-size:11px;color:var(--text-tertiary);margin-bottom:6px}
.email-card .preview{font-size:13px;color:var(--text-secondary);line-height:1.5}
.camp-row{background:var(--bg-primary);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow)}
.camp-row h4{font-size:13px;font-weight:600}
.camp-row p{font-size:12px;color:var(--text-secondary);margin-top:2px}
.reengage-card{background:var(--bg-primary);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow)}
.pagination{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:flex-end}
.status-pills{display:flex;gap:6px;flex-wrap:wrap}
.status-pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border-mid);cursor:pointer;font-size:12px;font-weight:600;background:none;color:var(--text-secondary);font-family:inherit;transition:all .12s}
.status-pill.sel-hot{background:var(--red-bg);color:var(--red-text);border-color:#f0997b}
.status-pill.sel-warm{background:var(--amber-bg);color:var(--amber-text);border-color:#ef9f27}
.status-pill.sel-good{background:var(--green-bg);color:var(--green-text);border-color:#97c459}
.status-pill.sel-cold{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-border)}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:var(--radius);font-size:13px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

function loadData(){
  try{
    if(localStorage.getItem(SEED_KEY)==='1'){
      const r=localStorage.getItem(STORAGE_KEY);
      if(r)return JSON.parse(r);
    }
    const base={brokers:JSON.parse(JSON.stringify(SEED)),campaigns:[],nextId:99,nextCampId:1};
    localStorage.setItem(STORAGE_KEY,JSON.stringify(base));
    localStorage.setItem(SEED_KEY,'1');
    return base;
  }catch(e){return{brokers:JSON.parse(JSON.stringify(SEED)),campaigns:[],nextId:99,nextCampId:1};}
}

function h(tag,props,...ch){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props||{})){
    if(k==='cls')e.className=v;
    else if(k==='style')Object.assign(e.style,v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of ch.flat())if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  return e;
}

    info.appendChild(h('div',{style:'font-size:11px;color:var(--text-tertiary);margin-top:3px'},`${camp.recipients.length} recipients · ${camp.status}${camp.date?' · '+fmtDate(camp.date):''}`));
    row.appendChild(info);
    const acts=h('div',{style:'display:flex;gap:6px;align-items:center'});
    if(camp.status==='draft')acts.appendChild(h('button',{cls:'btn btn-primary btn-sm',onclick:()=>{camp.status='sent';camp.date=new Date().toISOString().slice(0,10);save(data);toast('Campaign sent!');render();}},'📤 Send Now'));
    else acts.appendChild(h('span',{style:'font-size:12px;color:var(--green-text);font-weight:600'},'✓ Sent '+fmtDate(camp.date)));
    acts.appendChild(h('button',{cls:'btn btn-sm btn-danger',onclick:()=>{if(confirm('Delete campaign?')){data.campaigns=data.campaigns.filter(x=>x.id!==camp.id);save(data);render();}}},'✕'));
    row.appendChild(acts);c.appendChild(row);
  });
  return c;
}

function modalAddBroker(){
  const b=S.editBroker||S.newB;const isEdit=!!S.editBroker;
  const ov=h('div',{cls:'modal-overlay'});
  const m=h('div',{cls:'modal'});
  m.appendChild(h('div',{cls:'modal-header'},h('h3',{},isEdit?'✏️ Edit Broker':'➕ Add New Broker'),h('button',{cls:'btn btn-sm',onclick:()=>{S.addBroker=false;S.editBroker=null;render();}},'✕')));
  const body=h('div',{cls:'modal-body'});const grid=h('div',{cls:'form-grid'});
  function field(label,key,full=false,type='text'){
    const g=h('div',{cls:`form-group${full?' full':''}`});g.appendChild(h('label',{},label));
    const inp=h('input',{type,placeholder:label});inp.value=b[key]||'';inp.oninput=e=>b[key]=e.target.value;g.appendChild(inp);grid.appendChild(g);
  }
  field('Full Name','name');field('Title','title');field('Agency','agency');field('Email','email',false,'email');
  field('Mobile','mobile');field('Direct Phone','direct');field('State','state');field('LinkedIn URL','linkedin');
  field('Outreach Date','startDate',false,'date');field('Follow-up Date','followUp',false,'date');field('Address','address',true);
  const ng=h('div',{cls:'form-group full'});ng.appendChild(h('label',{},'Notes'));
  const nt=h('textarea',{placeholder:'Notes about this broker...'});nt.value=b.notes||'';nt.oninput=e=>b.notes=e.target.value;ng.appendChild(nt);grid.appendChild(ng);
  const sg=h('div',{cls:'form-group full'});sg.appendChild(h('label',{},'Status'));
  const pills=h('div',{cls:'status-pills'});
  [{s:'hot',l:'🔥 Hot'},{s:'warm',l:'☀️ Warm'},{s:'good',l:'✅ Good Fit'},{s:'cold',l:'❄️ Cold'}].forEach(({s,l})=>{
    const p=h('button',{cls:`status-pill${b.status===s?' sel-'+s:''}`,onclick:()=>{b.status=s;render();}},l);pills.appendChild(p);
  });sg.appendChild(pills);grid.appendChild(sg);
  const supG=h('div',{cls:'form-group full'});supG.appendChild(h('label',{},'Support Team (one per line: Name, Role)'));
  const supT=h('textarea',{placeholder:'Kathy Ruiz, Account Manager\nMichelle Ribeiro, Team Member'});
  supT.value=(b.support||[]).map(s=>s.name+', '+s.role).join('\n');
  supT.oninput=e=>{b.support=e.target.value.split('\n').filter(Boolean).map(l=>{const p=l.split(',').map(x=>x.trim());return{name:p[0]||'',role:p[1]||''};});};
  supG.appendChild(supT);grid.appendChild(supG);
  body.appendChild(grid);m.appendChild(body);
  const foot=h('div',{cls:'modal-footer'});
  foot.appendChild(h('button',{cls:'btn',onclick:()=>{S.addBroker=false;S.editBroker=null;render();}},'Cancel'));
  foot.appendChild(h('button',{cls:'btn btn-primary',onclick:()=>{
    if(!b.name.trim()){alert('Name required.');return;}
    if(isEdit){const i=data.brokers.findIndex(x=>x.id===b.id);if(i!==-1)data.brokers[i]={...data.brokers[i],...b};}
    else{b.id=data.nextId++;b.logs=[];b.emails=[];b.meetings=[];data.brokers.push(b);}
    S.addBroker=false;S.editBroker=null;save(data);toast(isEdit?'Broker updated!':'Broker added!');render();
  }},isEdit?'Save Changes':'Add Broker'));
  m.appendChild(foot);ov.appendChild(m);ov.onclick=e=>{if(e.target===ov){S.addBroker=false;S.editBroker=null;render();}};return ov;
}

function modalAddLog(){
  const b=data.brokers.find(x=>x.id===S.broker);
  const ov=h('div',{cls:'modal-overlay'});const m=h('div',{cls:'modal'});
  m.appendChild(h('div',{cls:'modal-header'},h('h3',{},'📝 Log Activity for '+b.name),h('button',{cls:'btn btn-sm',onclick:()=>{S.addLog=false;render();}},'✕')));

  const typeG=h('div',{cls:'form-group',style:'margin-bottom:12px'});typeG.appendChild(h('label',{},'Activity Type'));
  const ts=h('select',{});['call','email','meeting','note'].forEach(t=>{const o=h('option',{value:t},t[0].toUpperCase()+t.slice(1));if(t===S.logType)o.selected=true;ts.appendChild(o);});
  ts.onchange=e=>S.logType=e.target.value;typeG.appendChild(ts);
  const dG=h('div',{cls:'form-group',style:'margin-bottom:12px'});dG.appendChild(h('label',{},'Date'));
  let ld=new Date().toISOString().slice(0,10);const di=h('input',{type:'date'});di.value=ld;di.onchange=e=>ld=e.target.value;dG.appendChild(di);

function modalAddEmail(){
  const b=data.brokers.find(x=>x.id===S.broker);
  const ov=h('div',{cls:'modal-overlay'});const m=h('div',{cls:'modal'});
  m.appendChild(h('div',{cls:'modal-header'},h('h3',{},'📧 Log Email for '+b.name),h('button',{cls:'btn btn-sm',onclick:()=>{S.addEmail=false;render();}},'✕')));
  const body=h('div',{cls:'modal-body'});
  let dir='sent',ed=new Date().toISOString().slice(0,10);
  const dG=h('div',{cls:'form-group',style:'margin-bottom:12px'});dG.appendChild(h('label',{},'Direction'));
  const ds=h('select',{onchange:e=>dir=e.target.value});
  [{v:'sent',l:'Sent (Outbound)'},{v:'received',l:'Received (Inbound)'}].forEach(({v,l})=>ds.appendChild(h('option',{value:v},l)));dG.appendChild(ds);
  const dateG=h('div',{cls:'form-group',style:'margin-bottom:12px'});dateG.appendChild(h('label',{},'Date'));
  const di=h('input',{type:'date'});di.value=ed;di.onchange=e=>ed=e.target.value;dateG.appendChild(di);
  const sG=h('div',{cls:'form-group',style:'margin-bottom:12px'});sG.appendChild(h('label',{},'Subject'));const si=h('input',{type:'text',placeholder:'Subject'});sG.appendChild(si);
  const bG=h('div',{cls:'form-group'});bG.appendChild(h('label',{},'Email Body'));const bi=h('textarea',{placeholder:'Paste or type email content...'});bG.appendChild(bi);
  body.appendChild(dG);body.appendChild(dateG);body.appendChild(sG);body.appendChild(bG);m.appendChild(body);

    S.addEmail=false;save(data);toast('Email logged!');render();
  }},'Log Email'));
  m.appendChild(foot);ov.appendChild(m);ov.onclick=e=>{if(e.target===ov){S.addEmail=false;render();}};return ov;

function modalCompose(){
  const b=S.composeTarget;
  const ov=h('div',{cls:'modal-overlay'});const m=h('div',{cls:'modal'});
  m.appendChild(h('div',{cls:'modal-header'},h('h3',{},`📧 Email to ${b?b.name:'Broker'}`),h('button',{cls:'btn btn-sm',onclick:()=>{S.compose=false;render();}},'✕')));
  const body=h('div',{cls:'modal-body'});
  body.appendChild(h('div',{style:'margin-bottom:12px;color:var(--text-secondary)'},'To: ',h('strong',{},b?b.email||'(no email)':'—')));
  const si=h('input',{type:'text',placeholder:'Subject',style:'width:100%;margin-bottom:10px'});
  const bi=h('textarea',{placeholder:'Write your email...',style:'width:100%;min-height:240px'});
  body.appendChild(si);body.appendChild(bi);m.appendChild(body);
  const foot=h('div',{cls:'modal-footer'});
  foot.appendChild(h('button',{cls:'btn',onclick:()=>{S.compose=false;render();}},'Cancel'));
  foot.appendChild(h('button',{cls:'btn btn-primary',onclick:()=>{
    if(!si.value.trim()||!b){alert('Subject required.');return;}
    b.emails=b.emails||[];b.emails.push({id:Date.now(),direction:'sent',subject:si.value,date:new Date().toISOString().slice(0,10),body:bi.value});
    b.logs=b.logs||[];b.logs.push({id:Date.now(),type:'email',date:new Date().toISOString().slice(0,10),text:`Sent: "${si.value}"`,by:'You'});

function modalCampaign(){
  const camp=S.campDraft;
  const ov=h('div',{cls:'modal-overlay'});const m=h('div',{cls:'modal'});
  m.appendChild(h('div',{cls:'modal-header'},h('h3',{},'📧 New Email Campaign'),h('button',{cls:'btn btn-sm',onclick:()=>{S.campaign=false;render();}},'✕')));
  const body=h('div',{cls:'modal-body'});
  const nG=h('div',{cls:'form-group',style:'margin-bottom:12px'});nG.appendChild(h('label',{},'Campaign Name'));
  const ni=h('input',{type:'text',placeholder:'e.g. Q3 ICHRA Awareness'});ni.value=camp.name;ni.oninput=e=>camp.name=e.target.value;nG.appendChild(ni);
  const sG=h('div',{cls:'form-group',style:'margin-bottom:12px'});sG.appendChild(h('label',{},'Subject Line'));
  const si=h('input',{type:'text',placeholder:'Email subject'});si.value=camp.subject;si.oninput=e=>camp.subject=e.target.value;sG.appendChild(si);
  const rG=h('div',{cls:'form-group',style:'margin-bottom:12px'});rG.appendChild(h('label',{},`Recipients — brokers with email (${data.brokers.filter(b=>b.email&&b.status!=='cold').length} available)`));
  const rw=h('div',{style:'max-height:180px;overflow-y:auto;border:1px solid var(--border-light);border-radius:var(--radius);padding:8px'});
  data.brokers.filter(b=>b.email&&b.status!=='cold').forEach(b=>{
    const row=h('label',{style:'display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 0;font-size:13px'});
    const cb=h('input',{type:'checkbox'});cb.checked=camp.recipients.includes(b.email);
    cb.onchange=e=>{if(e.target.checked){if(!camp.recipients.includes(b.email))camp.recipients.push(b.email);}else{camp.recipients=camp.recipients.filter(r=>r!==b.email);}};
    row.appendChild(cb);row.appendChild(document.createTextNode(b.name+' · '+b.agency));rw.appendChild(row);
  });
  const selectAll=h('button',{cls:'btn btn-sm',style:'margin-bottom:8px',onclick:()=>{data.brokers.filter(b=>b.email&&b.status!=='cold').forEach(b=>{if(!camp.recipients.includes(b.email))camp.recipients.push(b.email);});render();}},'Select All');
  rG.appendChild(selectAll);rG.appendChild(rw);
  const bG=h('div',{cls:'form-group'});bG.appendChild(h('label',{},'Email Body (use {name} for personalization)'));
  const bi=h('textarea',{placeholder:'Hi {name},\n\nI wanted to reach out about ICHRA...',style:'min-height:180px'});bi.value=camp.body;bi.oninput=e=>camp.body=e.target.value;bG.appendChild(bi);
  body.appendChild(nG);body.appendChild(sG);body.appendChild(rG);body.appendChild(bG);m.appendChild(body);
  const foot=h('div',{cls:'modal-footer'});
  foot.appendChild(h('button',{cls:'btn',onclick:()=>{S.campaign=false;render();}},'Cancel'));
  foot.appendChild(h('button',{cls:'btn',onclick:()=>{
    if(!camp.name.trim()){alert('Name required.');return;}
    data.campaigns.push({id:data.nextCampId++,...camp,status:'draft',date:''});save(data);S.campaign=false;toast('Draft saved!');render();
  }},'💾 Save Draft'));
  foot.appendChild(h('button',{cls:'btn btn-primary',onclick:()=>{
    if(!camp.name.trim()||!camp.subject.trim()){alert('Name and subject required.');return;}
    if(!camp.recipients.length){alert('Select at least one recipient.');return;}
    data.campaigns.push({id:data.nextCampId++,...camp,status:'sent',date:new Date().toISOString().slice(0,10)});
    save(data);S.campaign=false;toast('Campaign sent to '+camp.recipients.length+' brokers!');render();
  }},'📤 Send Now'));
  m.appendChild(foot);ov.appendChild(m);ov.onclick=e=>{if(e.target===ov){S.campaign=false;render();}};return ov;
}

function exportCSV(){
  const hdr=['Name','Title','Agency','Email','Mobile','Direct','State','Status','LinkedIn','Address','Outreach Date','Follow-up','Notes','Support Team','Activities','Emails Logged'];
  const rows=data.brokers.map(b=>[b.name,b.title,b.agency,b.email,b.mobile,b.direct||'',b.state,b.status,b.linkedin||'',b.address||'',b.startDate||'',b.followUp||'',(b.notes||'').replace(/,/g,';'),(b.support||[]).map(s=>s.name+'('+s.role+')').join('|'),(b.logs||[]).length,(b.emails||[]).length]);
  const csv=[hdr,...rows].map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='ICHRA_Brokers_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  toast('CSV exported!');
}
