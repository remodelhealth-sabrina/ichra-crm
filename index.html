<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICHRA Broker CRM — SN | CA & HI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;font-size:14px}
a{text-decoration:none;color:inherit}

/* LAYOUT */
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:200px;background:#1e293b;color:#94a3b8;display:flex;flex-direction:column;flex-shrink:0}
.side-logo{padding:20px 16px 14px;border-bottom:1px solid #334155}
.side-logo h1{font-size:13px;font-weight:700;color:#f1f5f9;letter-spacing:.5px;text-transform:uppercase}
.side-logo p{font-size:10px;margin-top:3px;color:#64748b}
.side-nav{padding:8px;flex:1}
.nav-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#475569;padding:12px 8px 4px}
.nav-a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:#94a3b8;width:100%;text-align:left;transition:background .15s}
.nav-a:hover{background:#334155;color:#e2e8f0}
.nav-a.on{background:#3b82f6;color:#fff}
.nav-ct{margin-left:auto;background:#334155;border-radius:10px;padding:1px 7px;font-size:10px}
.side-foot{padding:12px;border-top:1px solid #334155;font-size:10px;color:#475569}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
.topbar h2{font-size:15px;font-weight:700;flex:1}
.page{flex:1;overflow-y:auto;padding:20px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:12px;font-weight:500;color:#374151;font-family:inherit;transition:background .12s}
.btn:hover{background:#f9fafb}
.btn-blue{background:#3b82f6;color:#fff;border-color:#2563eb}
.btn-blue:hover{background:#2563eb}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-red{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.btn-green{background:#dcfce7;color:#166534;border-color:#86efac}
.btn-amber{background:#fef3c7;color:#92400e;border-color:#fcd34d}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.stat{background:#fff;border-radius:8px;padding:14px;border:1px solid #e2e8f0}
.stat .lbl{font-size:10px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat .val{font-size:22px;font-weight:700}

/* TABLE */
.card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:#6b7280;background:#f8fafc;border-bottom:1px solid #e2e8f0;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #f1f5f9;font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.row:hover td{background:#f8fafc;cursor:pointer}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent}
.b-hot{background:#fee2e2;color:#991b1b}
.b-warm{background:#fef3c7;color:#92400e}
.b-good{background:#dcfce7;color:#166534}
.b-cold{background:#dbeafe;color:#1e40af}

/* AVATAR */
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}

/* PRIORITY BANNER */
.banner{background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:12px 16px;margin-bottom:16px}
.banner h4{font-size:12px;font-weight:700;color:#92400e;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid #fcd34d;border-radius:20px;padding:3px 12px;font-size:11px;cursor:pointer;font-weight:500;transition:background .12s}
.chip:hover{background:#fef3c7}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:10px;width:100%;max-width:700px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mh{padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
.mh h3{font-size:14px;font-weight:700}
.mb{padding:20px;max-height:65vh;overflow-y:auto}
.mf{padding:12px 20px;border-top:1px solid #e2e8f0;display:flex;gap:8px;justify-content:flex-end;background:#f8fafc;border-radius:0 0 10px 10px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fg label{font-size:11px;font-weight:600;color:#374151}
.fg input,.fg select,.fg textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit;width:100%;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#3b82f6}
.fg textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}

/* TABS */
.tabs{display:flex;border-bottom:1px solid #e2e8f0;margin-bottom:16px}
.tab{padding:9px 16px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:600;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;transition:color .12s}
.tab:hover{color:#1a1a1a}
.tab.on{color:#3b82f6;border-bottom-color:#3b82f6}

/* TIMELINE */
.tl{border-left:2px solid #e2e8f0;padding-left:16px;margin-left:8px}
.ti{margin-bottom:14px;position:relative}
.td{width:8px;height:8px;border-radius:50%;background:#3b82f6;position:absolute;left:-21px;top:5px}
.tm{font-size:10px;color:#6b7280;font-weight:600;margin-bottom:2px}
.tb2{font-size:12px;line-height:1.6}

/* BROKER DETAIL */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.info-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px}
.info-box .lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;margin-bottom:3px}
.info-box .val{font-size:12px;color:#1a1a1a;word-break:break-all}
.info-box a{color:#3b82f6}
.divider{height:1px;background:#e2e8f0;margin:14px 0}
.support-tag{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;margin:2px}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.sp{padding:5px 12px;border-radius:20px;border:1px solid #d1d5db;cursor:pointer;font-size:11px;font-weight:600;background:#fff;font-family:inherit}
.sp.sh{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.sp.sw{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.sp.sg{background:#dcfce7;color:#166534;border-color:#86efac}
.sp.sc{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.email-card{border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:8px;background:#fff}
.ec-subj{font-size:12px;font-weight:700;margin-bottom:2px}
.ec-meta{font-size:10px;color:#6b7280;margin-bottom:6px}
.ec-body{font-size:11px;color:#374151;line-height:1.6}
.empty{text-align:center;padding:40px;color:#9ca3af}
.empty .icon{font-size:36px;margin-bottom:8px}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#f1f5f9;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:500;z-index:999;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pg{display:flex;align-items:center;gap:8px;margin-top:12px;justify-content:flex-end}
.pg span{font-size:11px;color:#6b7280}
.reengage-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.reengage-card h4{font-size:12px;font-weight:700}
.reengage-card p{font-size:11px;color:#6b7280;margin-top:2px}

/* ── UPGRADES ── */
.opp-pill{display:inline-flex;align-items:center;gap:4px;background:#fef9c3;color:#713f12;border:1px solid #fcd34d;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700}
.tpl-bar{margin-top:10px;padding:10px 12px;background:var(--slate5);border-radius:6px;border:1px solid var(--slate4)}
.tpl-bar p{font-size:10px;font-weight:700;color:var(--slate);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.tpl-btns{display:flex;gap:6px;flex-wrap:wrap}
.hdr-detail{background:var(--white);border:1px solid var(--slate4);border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.info-card{background:var(--slate6);border:1px solid var(--slate4);border-radius:8px;padding:10px 12px}
.info-card .ic-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin-bottom:3px}
.info-card .ic-val{font-size:12px;color:var(--navy);font-weight:500;word-break:break-all}
.info-card a{color:var(--blue)}
.fu-box{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #93c5fd;border-radius:10px;padding:14px 16px}
.fu-box h4{font-size:11px;font-weight:700;color:var(--blue4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.act-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.camp-stat{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--green);background:var(--green2);padding:3px 8px;border-radius:4px}
.toast{animation:tin .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>

function loadData(){
  try{
    if(localStorage.getItem(SEEDED)==='1'){
      const r=localStorage.getItem(SK);
      if(r)return JSON.parse(r);
    }
    const d={brokers:JSON.parse(JSON.stringify(SEED)),campaigns:[],nextId:99,nextCampId:1};
    localStorage.setItem(SK,JSON.stringify(d));
    localStorage.setItem(SEEDED,'1');
    return d;
  }catch(e){return{brokers:JSON.parse(JSON.stringify(SEED)),campaigns:[],nextId:99,nextCampId:1};}
}
function save(){try{localStorage.setItem(SK,JSON.stringify(D));}catch(e){}}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}

// ── UTILS ─────────────────────────────────────────────────────────────────
const AVB=[['#ede9fe','#5b21b6'],['#d1fae5','#065f46'],['#fee2e2','#991b1b'],['#fef3c7','#78350f'],['#dbeafe','#1e3a8a'],['#fce7f3','#831843']];
function avEl(name,i,lg){const[bg,c]=AVB[i%AVB.length];const d=document.createElement('div');d.className='av';if(lg){d.style.width='44px';d.style.height='44px';d.style.fontSize='14px';}d.style.background=bg;d.style.color=c;d.textContent=name.split(' ').map(w=>w[0]||'').slice(0,2).join('').toUpperCase();return d;}
function badgeEl(s){const map={hot:['🔥 Hot','b-hot'],warm:['☀️ Warm','b-warm'],good:['✅ Good','b-good'],cold:['❄️ Cold','b-cold']};const[l,c]=map[s]||['?','b-cold'];const b=document.createElement('span');b.className='badge '+c;b.textContent=l;return b;}
function fmt(s){if(!s)return'—';try{return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch{return s;}}
function div(cls,html=''){const d=document.createElement('div');d.className=cls;if(html)d.innerHTML=html;return d;}
function btn(label,cls,cb){const b=document.createElement('button');b.className='btn '+cls;b.innerHTML=label;b.onclick=cb;return b;}
function inp(type,val,ph,cb){const i=document.createElement('input');i.type=type;i.value=val||'';i.placeholder=ph||'';if(cb)i.oninput=e=>cb(e.target.value);return i;}
function sel(opts,cur,cb){const s=document.createElement('select');opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(v===cur)o.selected=true;s.appendChild(o);});s.onchange=e=>cb(e.target.value);return s;}
function ta(val,ph,cb){const t=document.createElement('textarea');t.value=val||'';t.placeholder=ph||'';if(cb)t.oninput=e=>cb(e.target.value);return t;}

function nav(view,el){
  V.view=view;V.bid=null;V.page=0;V.sf='all';
  document.querySelectorAll('.nav-a').forEach(a=>a.classList.remove('on'));
  if(el)el.classList.add('on');
  render();
}
function navFilter(status,el){
  V.view='brokers';V.sf=status;V.page=0;V.bid=null;
  document.querySelectorAll('.nav-a').forEach(a=>a.classList.remove('on'));
  if(el)el.classList.add('on');
  render();
}
function updateCounts(){
  ['hot','warm','good','cold'].forEach(s=>{
    const el=document.getElementById('ct-'+s);
    if(el)el.textContent=D.brokers.filter(b=>b.status===s).length;
  });
  const f=document.getElementById('side-foot');
  if(f)f.textContent=D.brokers.length+' brokers total';
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  updateCounts();
  const title=document.getElementById('page-title');
  const actions=document.getElementById('topbar-actions');
  const page=document.getElementById('page');
  actions.innerHTML='';
  page.innerHTML='';

  if(V.view==='dashboard'){title.textContent='📊 Dashboard';renderDash(page);}
  else if(V.view==='brokers'){title.textContent='👥 All Brokers';renderBrokerTools(actions);renderList(page);}
  else if(V.view==='detail'){title.textContent='Broker Profile';renderDetailTools(actions);renderDetail(page);}
  else if(V.view==='campaigns'){title.textContent='📧 Email Campaigns';renderCampTools(actions);renderCampaigns(page);}
  else if(V.view==='reengagement'){title.textContent='🔄 Re-engagement';renderReengage(page);}
}

function renderDash(p){

    const sc=div('stat');sc.innerHTML=`<div class="lbl">${l}</div><div class="val" style="color:${c}">${v}</div><div class="ssub" style="font-size:10px;color:#6b7280;margin-top:3px">${sub||''}</div>`;sr.appendChild(sc);
  });
  p.appendChild(sr);

  if(hot.length){

    mf2.appendChild(btn('Cancel','btn',()=>{document.getElementById('modal-root').innerHTML='';}));
    mf2.appendChild(btn(isEdit?'Save Changes':'Add Broker','btn-blue',()=>{
      if(!b.name.trim()){alert('Name required.');return;}
      if(isEdit){const i=D.brokers.findIndex(x=>x.id===b.id);if(i!==-1)D.brokers[i]={...D.brokers[i],...b};}
      else{b.id=D.nextId++;b.logs=[];b.emails=[];b.meetings=[];D.brokers.push(b);}
      save();document.getElementById('modal-root').innerHTML='';toast(isEdit?'Broker updated!':'Broker added!');render();
    }));
  });
}

function showAddLog(b){

    const ng=div('fg');ng.innerHTML='<label>Notes</label>';const nt=ta(logText,'What happened in this interaction?');nt.oninput=e=>logText=e.target.value;ng.appendChild(nt);mb.appendChild(ng);
  },mf2=>{
    mf2.appendChild(btn('Cancel','btn',()=>document.getElementById('modal-root').innerHTML=''));

function showCompose(b){
  let subj='',body2='';
  modal('✉️ Email to '+b.name,mb=>{
    mb.innerHTML=`<div style="margin-bottom:12px;font-size:12px;color:#6b7280;padding:10px 12px;background:#eff6ff;border-radius:6px;border:1px solid #93c5fd">To: <strong style="color:#1e40af">${b.email||'(no email on file)'}</strong>${b.agency?' &nbsp;·&nbsp; <span style="color:#374151">'+b.agency+'</span>':''}</div>`;
    const sg=div('fg');sg.innerHTML='<label>Subject Line</label>';const si=inp('text',subj,'e.g. ICHRA Overview for Your Clients');si.oninput=e=>subj=e.target.value;sg.appendChild(si);mb.appendChild(sg);
    const bg=div('fg');bg.innerHTML='<label>Email Body</label>';const bi=ta(body2,'Hi '+b.name.split(' ')[0]+',\n\n');bi.style.minHeight='180px';bi.oninput=e=>body2=e.target.value;bg.appendChild(bi);mb.appendChild(bg);
    // Templates
    const tbar=div('');tbar.style.cssText='margin-top:10px;padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px';
    tbar.innerHTML='<div style="font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px">⚡ Quick Templates — click to fill</div>';
    const trow=div('');trow.style.cssText='display:flex;gap:6px;flex-wrap:wrap';
    const firstName=b.name.split(' ')[0];
    [['📋 ICHRA Intro','ICHRA Introduction — '+b.agency,'Hi '+firstName+',\n\nI wanted to reach out and introduce you to ICHRA (Individual Coverage HRA) — one of the most flexible and cost-effective employer health benefit tools available today.\n\nICHRA allows employers to:\n• Set their own monthly reimbursement amounts\n• Give employees freedom to choose individual plans\n• Eliminate the complexity of traditional group coverage\n\nWith the growing individual market in CA, this is a major opportunity for your book of business.\n\nWould you have 20 minutes this week for a quick overview call?\n\nBest regards,\nSN | ICHRA Specialist'],
    ['🔥 Follow-Up','Following Up — ICHRA Opportunity','Hi '+firstName+',\n\nJust following up on our previous conversation about ICHRA. I wanted to check if you had any questions or if any groups in your book are coming up for renewal.\n\nEven groups with 5–50 lives can benefit significantly.\n\nHappy to jump on a 15-minute call whenever works for you!\n\nBest,\nSN'],
    ['🎓 ICHRA 101','Invitation: ICHRA 101 Broker Training','Hi '+firstName+',\n\nI\'d love to invite you to our ICHRA 101 Broker Training — a focused session covering:\n\n• What ICHRA is and how it works\n• ACA compliance requirements\n• How to identify ideal employer candidates\n• Positioning ICHRA vs. traditional group plans\n\nThis is a great way to add a high-demand product to your offering.\n\nInterested? Let me know your availability!\n\nBest,\nSN'],
    ['📊 Q4 Nurture','Q4 Planning — ICHRA for Your Groups','Hi '+firstName+',\n\nWith Q4 planning season underway, I wanted to reconnect about ICHRA opportunities in your book.\n\nMany employers are seeking alternatives to rising group premiums — ICHRA gives them a compliant, budget-friendly solution.\n\nLet\'s connect for a quick strategy call on any upcoming renewals!\n\nBest,\nSN']
    ].forEach(([label,s,body])=>{
      const tb=btn(label,'btn btn-sm',()=>{si.value=s;bi.value=body;subj=s;body2=body;});
      tb.style.cssText='font-size:10px;padding:4px 9px';
      trow.appendChild(tb);
    });
    tbar.appendChild(trow);mb.appendChild(tbar);
  },mf2=>{
    mf2.appendChild(btn('Cancel','btn',()=>document.getElementById('modal-root').innerHTML=''));
    mf2.appendChild(btn('📤 Send & Log','btn-blue',()=>{
      if(!subj.trim()){alert('Subject required.');return;}
      b.emails=b.emails||[];b.emails.push({id:Date.now(),direction:'sent',subject:subj,date:new Date().toISOString().slice(0,10),body:body2});
      b.logs=b.logs||[];b.logs.push({id:Date.now(),type:'email',date:new Date().toISOString().slice(0,10),text:`Sent email: "${subj}"`});
      save();document.getElementById('modal-root').innerHTML='';toast('Email logged to '+b.name+'!');render();

function showCampaign(){
  const camp={name:'',subject:'',body:'',recipients:[]};
  modal('📧 New Email Campaign',mb=>{
    mb.innerHTML='';
    const ng=div('fg');ng.innerHTML='<label>Campaign Name</label>';const ni=inp('text','','e.g. Q3 ICHRA Awareness');ni.oninput=e=>camp.name=e.target.value;ng.appendChild(ni);mb.appendChild(ng);
    const sg=div('fg');sg.innerHTML='<label>Subject</label>';const si=inp('text','','Email subject');si.oninput=e=>camp.subject=e.target.value;sg.appendChild(si);mb.appendChild(sg);
    const rg=div('fg');rg.innerHTML='<label>Recipients (brokers with email)</label>';
    const rw=div('');rw.style.cssText='max-height:160px;overflow-y:auto;border:1px solid #d1d5db;border-radius:6px;padding:8px';
    const salL=document.createElement('label');salL.style.cssText='display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 0;font-weight:700;cursor:pointer';
    const sacb=document.createElement('input');sacb.type='checkbox';sacb.onchange=e=>{
      D.brokers.filter(b=>b.email&&b.status!=='cold').forEach(b=>{if(e.target.checked){if(!camp.recipients.includes(b.email))camp.recipients.push(b.email);}else{camp.recipients=camp.recipients.filter(r=>r!==b.email);}});
    };salL.appendChild(sacb);salL.appendChild(document.createTextNode('Select All'));rw.appendChild(salL);
    D.brokers.filter(b=>b.email&&b.status!=='cold').forEach(b=>{
      const l=document.createElement('label');l.style.cssText='display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 0;cursor:pointer';
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=camp.recipients.includes(b.email);
      cb.onchange=e=>{if(e.target.checked){if(!camp.recipients.includes(b.email))camp.recipients.push(b.email);}else{camp.recipients=camp.recipients.filter(r=>r!==b.email);}};
      l.appendChild(cb);l.appendChild(document.createTextNode(b.name+' · '+b.agency));rw.appendChild(l);
    });rg.appendChild(rw);mb.appendChild(rg);
    const bg=div('fg');bg.innerHTML='<label>Email Body (use {name} for personalization)</label>';const bi=ta('','Hi {name},\n\nI wanted to reach out about ICHRA...');bi.oninput=e=>camp.body=e.target.value;bg.appendChild(bi);mb.appendChild(bg);
  },mf2=>{
    mf2.appendChild(btn('Cancel','btn',()=>document.getElementById('modal-root').innerHTML=''));
    mf2.appendChild(btn('💾 Save Draft','btn',()=>{
      if(!camp.name.trim()){alert('Name required.');return;}
      D.campaigns.push({id:D.nextCampId++,...camp,status:'draft',date:''});save();document.getElementById('modal-root').innerHTML='';toast('Draft saved!');render();
    }));
    mf2.appendChild(btn('📤 Send Now','btn-blue',()=>{
      if(!camp.name.trim()||!camp.subject.trim()){alert('Name and subject required.');return;}
      if(!camp.recipients.length){alert('Select at least one recipient.');return;}
      D.campaigns.push({id:D.nextCampId++,...camp,status:'sent',date:new Date().toISOString().slice(0,10)});
      save();document.getElementById('modal-root').innerHTML='';toast('Campaign sent to '+camp.recipients.length+' brokers!');render();
    }));
  });
}

// ── EXPORT ────────────────────────────────────────────────────────────────
function exportCSV(){
  const hdr=['Name','Title','Agency','Email','Mobile','Direct','State','Status','LinkedIn','Address','Outreach Date','Follow-up','Notes','Support Team','Activities','Emails'];
  const rows=D.brokers.map(b=>[b.name,b.title,b.agency,b.email,b.mobile,b.direct||'',b.state,b.status,b.linkedin||'',b.address||'',b.startDate||'',b.followUp||'',(b.notes||'').replace(/,/g,';'),(b.support||[]).map(s=>s.name+'('+s.role+')').join('|'),(b.logs||[]).length,(b.emails||[]).length]);
  const csv=[hdr,...rows].map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='ICHRA_Brokers_'+new Date().toISOString().slice(0,10)+'.csv';a.click();toast('CSV exported!');
}
